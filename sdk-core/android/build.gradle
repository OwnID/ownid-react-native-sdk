def ownIdExtOrDefault = { String propertyName, int fallback ->
  rootProject.ext.has(propertyName) ? rootProject.ext.get(propertyName) : fallback
}

def ownIdCompileSdkVersion = ownIdExtOrDefault("compileSdkVersion", 36).toString().toInteger()
def ownIdMinSdkVersion = ownIdExtOrDefault("minSdkVersion", 24).toString().toInteger()

apply plugin: "com.android.library"

android {
  namespace "com.ownid.sdk.reactnative.core"
  compileSdkVersion ownIdCompileSdkVersion

  defaultConfig {
    minSdkVersion Math.max(ownIdMinSdkVersion, 24)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation project(":react-native-webview")
  implementation "androidx.credentials:credentials:1.6.0"
  implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
  compileOnly "androidx.webkit:webkit:1.14.0"
}
